[project]
name = "card-studio"
version = "0.1.0"
description = "YuriOS Card Studio — a web app to design, test, and export character cards (book Build #3)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
e2e = ["playwright>=1.44"]

[tool.pytest.ini_options]
testpaths = ["tests"]
