<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRM Viewer — Python-controlled</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      body { background: #1a1b26; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #status {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        padding: 8px 12px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.45); color: #c0caf5; font-size: 12px;
        line-height: 1.5; pointer-events: none; white-space: pre;
      }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .dot.on { background: #9ece6a; }
      .dot.off { background: #f7768e; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
